<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ares</title>
  <style>
    :root { color-scheme: dark; --bg:#090d18; --panel:#11182a; --line:#263252; --accent:#67d7c5; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at top,#17213b,var(--bg)); color:#edf3ff; }
    main { height:100vh; display:grid; grid-template-rows:auto auto 1fr auto; max-width:980px; margin:auto; padding:16px; }
    header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding:8px 4px 14px; }
    h1 { margin:0; font-size:20px; letter-spacing:.08em; }
    .controls { display:flex; gap:8px; align-items:center; }
    select, input, button, textarea { background:#171f35; color:#fff; border:1px solid var(--line); border-radius:10px; }
    select, input { padding:8px; }
    #settings { display:none; gap:8px; padding:10px 4px; border-bottom:1px solid var(--line); }
    #settings.open { display:flex; }
    #settings input { flex:1; }
    #messages { overflow:auto; padding:18px 4px; }
    .message { max-width:78%; margin:10px 0; padding:12px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
    .user { margin-left:auto; background:#20345a; }
    .assistant { background:var(--panel); border:1px solid var(--line); }
    .error { background:#4a2028; border-color:#a64e5c; }
    form { display:grid; grid-template-columns:1fr auto; gap:10px; }
    textarea { resize:none; height:70px; padding:13px; font:inherit; }
    button { padding:0 22px; cursor:pointer; background:var(--accent); color:#081410; font-weight:700; }
    button.secondary { background:#171f35; color:#edf3ff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>ARES</h1>
    <div class="controls">
      <label>Mode <select id="mode"><option value="local">Local gratuit</option><option value="online">En ligne</option></select></label>
      <button id="settingsButton" class="secondary" type="button">Paramètres</button>
    </div>
  </header>
  <div id="settings">
    <input id="apiKey" type="password" autocomplete="off" placeholder="Clé API personnelle">
    <input id="localModel" placeholder="Modèle Ollama" value="qwen2.5:1.5b">
    <button id="saveSettings" type="button">Enregistrer</button>
  </div>
  <section id="messages" aria-live="polite"></section>
  <form id="form"><textarea id="prompt" placeholder="Parle à Ares…" aria-label="Message"></textarea><button id="send" type="submit">Envoyer</button></form>
</main>
<script src="renderer.js"></script>
</body>
</html>
